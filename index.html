  <script>
    // 起動中や画面を描くときのエラーを、画面に出す（スマホで動かないときに、何が起きたかを教えてもらえるように）
    (function () {
      var shown = 0;
      function show(msg, src, line) {
        if (shown++ > 2) return;
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'boot-error';
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#fff3f0;color:#5a1a10;border:2px solid #d9573f;border-radius:12px;padding:10px 12px;font:13px/1.6 sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25)';
          box.innerHTML = '<b>エラーが起きました</b>（この画面の写真を送ってもらえると直せます）<div class="m" style="word-break:break-all;margin:4px 0"></div><button type="button" onclick="location.reload()" style="padding:6px 14px;border-radius:999px;border:1px solid #d9573f;background:#fff">再読み込み</button>';
          (document.body || document.documentElement).appendChild(box);
        }
        var file = String(src || '').split('/').pop().split('?')[0];
        box.querySelector('.m').textContent += (msg || '不明なエラー') + (file ? '（' + file + ' ' + (line || '') + '行目）' : '') + ' / ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 80) + '　';
      }
      window.addEventListener('error', function (e) { show(e.message, e.filename, e.lineno); });
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
    })();
  </script>
